name: Branch policy

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.6
      - name: Validate source branch
        env:
          BRANCH_NAME_OVERRIDE: ${{ github.head_ref }}
        run: node scripts/git/validate-branch.mjs
      - name: Protect production flow
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "Only dev may open a production PR to main."
            exit 1
          fi
